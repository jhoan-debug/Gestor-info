version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_optica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2006"
      POSTGRES_DB: optica
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup_postgres.sql:/docker-entrypoint-initdb.d/setup_postgres.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: api_optica
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DB_USER: postgres
      DB_PASS: "2006"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: optica
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend   # <── AQUÍ LA CORRECCIÓN
    container_name: web_optica
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data:
